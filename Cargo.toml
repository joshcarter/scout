[lints.clippy]
# Pedantic is on so the *next* instance of a real idiom problem gets caught.
# That only works if the build is quiet, so everything allowed below was
# looked at and judged noise for this codebase rather than waved through:
pedantic = { level = "warn", priority = -1 }

# scout is one binary and one internal library. `#[must_use]` on 82 internal
# functions documents nothing a caller could get wrong.
must_use_candidate = "allow"
return_self_not_must_use = "allow"

# Same reasoning for prose sections. Errors are described where they are
# returned, and the crate has no external consumers to write reference docs for.
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Flags ordinary English in comments — `elapsed_ms`, `endpoint_unavailable`,
# `Grok Build` — as needing backticks. This codebase's comments are prose that
# explains why, and prose is the point.
doc_markdown = "allow"

# Wants Duration::from_secs(120) rewritten as from_mins(2). The domain unit is
# seconds everywhere — `[llm] timeout_seconds`, `timeout_seconds` in the MCP
# schema — so from_secs is the spelling that matches the config it implements.
duration_suboptimal_units = "allow"

# Checked case by case in an earlier review: every one is either a display-only
# float cast or already behind a sign/range guard clippy cannot see through.
# 42 warnings, no findings.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"

# A `const MAX_BYTES` declared next to the code that uses it reads better than
# one hoisted to the top of the function away from its reason.
items_after_statements = "allow"

[package]
name = "scout-llm"
version = "0.1.0"
edition = "2021"
description = "Local-LLM scout for coding agents: classifies build/test output, screens shell commands, and answers targeted code questions so the cloud model doesn't have to."
repository = "https://github.com/joshcarter/scout"

# Everything lives in the library; the binary is argv parsing and dispatch.
# The lib exists so integration tests can `use scout_llm::…` — see src/lib.rs.
[lib]
name = "scout_llm"
path = "src/lib.rs"

# The binary name is load-bearing and deliberately not the package name: the
# hooks invoke `scout`, and `make build` copies target/release/scout into
# plugins/scout/bin/scout.
[[bin]]
name = "scout"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# ripgrep's libraries: gitignore-aware walking + the match engine, so scout
# needs no installed `rg`/`grep` and behaves identically on macOS and Linux.
# `grep-matcher` is already in the tree under the two below; it is named
# directly only so the `Matcher` trait can be brought into scope for the
# per-line `find` that recovers a match's column (docs/search-cli.md §4).
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
# The dashboard daemon only: `setsid` for the detach (without it a ^C in the
# launching shell kills the daemon) and SO_REUSEADDR so a well-known port
# rebinds through TIME_WAIT on `--restart`. Nothing else in scout uses it.
libc = "0.2"
rmcp = { version = "3.1", features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The `scout edit` quickfix path (edit.rs) needs `NamedTempFile`'s O_EXCL
# creation to avoid a predictable-path symlink race in shared /tmp — a
# dev-only dependency can't be linked into the release binary, hence its
# promotion out of [dev-dependencies].
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
toml = "0.8"
ureq = "2"
