# scout configuration — copy to $XDG_CONFIG_HOME/scout/config.toml
# (default ~/.config/scout/config.toml)
#
# Override the whole path with $SCOUT_CONFIG. Only the [llm] table is
# required, and within it only `endpoint` and `model`; everything below
# is optional and shown at its default.

[llm]
# Any OpenAI-compatible chat-completions base URL. A trailing slash is
# stripped. The values below are LM Studio on its default port, which is
# the only host scout has been tested against — ollama (:11434, and model
# names like `qwen3:27b`) speaks the same API and is expected to work, but
# is unverified. `model` must name a model the host has loaded; ask yours
# what it is (`curl http://localhost:1234/v1/models`) rather than trusting
# this line, which is only the author's.
endpoint = "http://localhost:1234/v1"
model = "qwen/qwen3.6-35b-a3b"

# Sent as `Authorization: Bearer <key>`. Local hosts usually ignore the
# value but some require the header to be present at all. LM Studio
# ignores it; any non-empty string will do where one is needed.
# api_key = "lm-studio"

# The outer bound on a whole call — connect, request, and the entire
# reply. Clamped to 1..3600.
# timeout_seconds = 120

# Two progress budgets, applied to a streamed reply only (see `stream`
# below). They exist because a total-elapsed deadline cannot tell a
# slow-but-working model from a hung one: a model emitting tokens steadily
# is healthy however long it has been running, and a connection that has
# produced nothing for twenty seconds is wedged however recently it
# started. Raising timeout_seconds to cover the first case buys minutes of
# waiting on the second.
#
# first_token_timeout_seconds bounds "the model never started". Generous,
# because a cold local host loads several gigabytes of weights off disk
# before the first byte and that is not a fault. It is measured from the
# moment the reply's headers arrive, and only until the first token; after
# that it is never consulted again.
#
# idle_timeout_seconds bounds "the model stopped mid-answer" — the longest
# silence tolerated *between* tokens, armed only once the first one has
# landed. Tight, because by then the model has proved it can produce.
# Raise it if your host batches tokens in large, infrequent flushes.
#
# Both are clamped to 1..3600, and timeout_seconds still applies on top of
# them as the outer net.
# first_token_timeout_seconds = 60
# idle_timeout_seconds = 15

# Cap on generated tokens. Unset means no cap is sent; a per-call
# argument overrides this.
# max_tokens = 2048

# Read the reply as it is generated instead of in one piece. Purely
# observability: the text and the token counts are identical either way,
# and the only visible difference is that `scout dashboard` fills the
# response pane live instead of at the end. Measured at no latency cost
# against LM Studio; turn it off if your host drops the token counts
# under streaming (ollama is untested here) — `scout stats` reads them.
# stream = true

# Filter tunables. Same rule as [spool] and [wrap]: a missing file or
# section is the defaults; a key that is present and unusable is an
# error, reported once on stderr, and the defaults are used so a typo
# never costs the caller the filter.

[extract]
# Files at or under this many lines skip the local model and are
# returned whole, so extract works before any config exists.
# bypass_max_lines = 200
# chunk_bytes = 393216
# default_max_lines = 120
# max_file_bytes = 4194304

[grep]
# Hit lists at or under this size skip the local model, as above.
# bypass_max_hits = 8
# max_considered = 500
# batch_size = 250
# context_lines = 2
# context_max_bytes = 2000
# max_file_bytes = 1048576
# max_hits_scanned = 2000

# Terminal rendering for `scout grep`. Read only by the CLI — the MCP
# server never consults this table, so nothing here changes what Claude
# sees. Parsed like the two tables above.

[cli]
# auto | always | never. `auto` colors only when stdout is a terminal and
# NO_COLOR is unset. --color overrides.
# color = "auto"

# Default context lines around a match. Falls back to [grep]
# context_lines when unset. -C/--context overrides.
# context = 2

# Default result cap for terminal invocations — higher than the wire
# default of 10 because it is a ceiling, not a quota: the model returns
# only the hits it kept. -n/--max-hits overrides.
# max_hits = 20

# Per-line render cap, in bytes. A matched line over the cap is shown as a
# window around the match, ellipsised on the truncated side(s) and labelled
# with the line's real width; a context line is simply cut at the cap. 0
# disables the cap. -M/--max-columns overrides. Terminal rendering only:
# --format json and --format vimgrep are never capped.
# max_columns = 150

# `scout find` — intent-only search: you ask a question, the local model
# guesses the patterns, scout runs them and reranks the union. CLI-only
# (find is not an MCP tool), and parsed like the tables above.

[find]
# Search rounds before giving up. A round is retried when *every* guessed
# pattern matched nothing, and when the reflect stage below judges the
# results off-target and names better patterns. Both kinds of retry share
# this one budget. 1 disables both. --attempts overrides.
# max_attempts = 3

# Candidate patterns requested from the model per round. Each one costs
# one search of the tree, so this is a latency knob as much as a
# recall knob.
# max_patterns = 8

# A guessed pattern matching more lines than this is a bad discriminator
# (`parse` in a parser), and *all* of its hits are dropped before the
# reranker sees them — a pattern that matches everything distinguishes
# nothing.
# degenerate_hit_cap = 300

# Byte cap on the paths-only file-tree sketch shown to the pattern
# guesser. Paths only — never symbols or file contents.
# tree_max_bytes = 8192

# Reflect and refine: after the rerank keeps a list, one more small call
# asks whether those hits actually answer the question, and re-searches
# with the identifiers it can see in them when they do not (a comment
# naming `draw_waterslide` is a pointer to the answer, not the answer).
# Costs one LLM call per run, plus a round when it says no. Set false to
# skip the stage entirely.
# reflect = true

# `scout dashboard` — the local web view of the call log. Start it with
# `scout dashboard` (idempotent, detaches), stop it with `--stop`.

[dashboard]
# Port for the dashboard. The bind *address* is
# 127.0.0.1 and is deliberately not configurable: the payloads carry file
# contents from every repo you work in, so loopback is the only address
# worth serving them on.
# port = 13001
#
# Prompt and response bodies travel the live channel (unix socket + SSE)
# and are held in the daemon's memory only. They are not written to the
# call log. A daemon restart loses them; that is accepted. The persist_bodies
# sidecar is a later, opt-in phase.

# The raw spool — the full captured output behind every filtered result,
# kept under ${XDG_CACHE_HOME:-~/.cache}/scout/raw/ so a summary that
# dropped the one line you needed is a Read away instead of a re-run.
# Cache, not state: disposable by design, unlike the call log.
#
# Pruned on every write and by `scout gc`, which needs no daemon and no
# cron: blobs past max_age_days go first, then the oldest remaining until
# the total is back under max_total_bytes. Expiry is a clean failure — a
# reader arriving late gets file-not-found, which is honest — so the
# window only has to comfortably outlive a working session.
# `scout gc --all` empties the spool outright.
#
# Parsed like the other optional sections: a bound that is present but
# not a non-negative integer is an error, not a silently-restored default.

[spool]
# max_age_days = 7
# max_total_bytes = 524288000

# `wrap` — run any verbose command and get its output condensed, with the
# full capture spooled to the raw path above. Parsed strictly, like [llm]
# and [spool]: a bound that is present but not a non-negative integer is an
# error, not a silently-restored default. A [wrap] scout cannot parse is
# ignored on the write path all the same — a mistyped tunable must never be
# why a command's result is lost.

# `check_output` — run a build/test and classify its output. The wall
# clock is a circuit breaker; idle is the real "wedged" check. A
# monorepo whose link step is silent for four minutes wants the idle
# deadline moved, not the wall clock. Zero is rejected (it would kill
# a healthy build on the first poll). A mistyped value is reported and
# the shipped defaults are used, so a typo never costs the command.
[check_output]
# How long the command may print nothing while still alive.
# idle_timeout_seconds = 120
# Wall-clock ceiling when the caller omits timeout_seconds.
# default_timeout_seconds = 900

[wrap]
# Output at or under *both* of these is returned whole and unfiltered: no
# model call, nothing spooled, nothing dropped. That is what makes guessing
# wrong about "this will be verbose" cost only the exec. The byte cap sits
# alongside the line count because twenty 4 KB lines are not short.
# passthrough_max_lines = 200
# passthrough_max_bytes = 16384

# How much of the capture the local model is shown, head+tail elided. The
# spool always gets everything that was captured, however little of it the
# model saw — the elision is a prompt-budget decision, the spool is ground
# truth, and `raw_path` is what makes filtering recoverable.
# model_input_bytes = 16384
#
# Same shape as [check_output]: idle is the wedged check, the wall clock
# is the circuit breaker. Zero is rejected. A mistyped value is an
# error and the shipped defaults are used.
# idle_timeout_seconds = 120
# default_timeout_seconds = 900

# `wait` — block on detached wrap jobs until they finish. A quiet job is
# normal (idle 0) and the caller sets the deadline (wall 0). The shipped
# 1500 s cap sits under Claude Code's 30-minute stdio idle abort so a
# silent wait still returns {timed_out: true} instead of a harness error.
# Raising this to 1800 races that abort; raise it only with
# CLAUDE_CODE_MCP_TOOL_IDLE_TIMEOUT=0 (or Grok's tool_timeout_sec).
# Zero is rejected for max_jobs / max_block_seconds.
[wait]
# max_jobs = 16
# max_block_seconds = 1500
# idle_timeout_seconds = 0
# wall_timeout_seconds = 0

# Extra deny patterns for the shell-safety hook. These extend the
# baked-in deny floor and can never shrink it. Read by
# hooks/shell-safety.sh, not by the binary.
# [shell_safety]
# deny = ["rm -rf /", "dd if=.* of=/dev/"]
#
# Worst-case stall before the permission prompt, in seconds. Clamped to
# 1..60 — this hook blocks a human, so the ceiling is patience, not
# model health. $SCOUT_SHELL_SAFETY_TIMEOUT overrides this when set.
# timeout_seconds = 5

# Ceiling on the two scout subprocesses the prefer-local-llm hook
# spawns (`classify-command` and `run --ping`). Read by
# hooks/prefer-local-llm.sh, not by the binary. Same 1..60 clamp;
# $SCOUT_PREFER_LOCAL_TIMEOUT overrides this when set.
# [prefer_local]
# timeout_seconds = 6
