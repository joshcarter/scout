# scout configuration — copy to $XDG_CONFIG_HOME/scout/config.toml
# (default ~/.config/scout/config.toml)
#
# Override the whole path with $SCOUT_CONFIG. Only the [llm] table is
# required, and within it only `endpoint` and `model`; everything below
# is optional and shown at its default.

[llm]
# Any OpenAI-compatible chat-completions base URL. A trailing slash is
# stripped. Common hosts: ollama on :11434, LM Studio on :1234.
endpoint = "http://localhost:11434/v1"
model = "qwen3:27b"

# Sent as `Authorization: Bearer <key>`. Local hosts usually ignore the
# value but some require the header to be present at all.
# api_key = "local"

# Clamped to 1..3600.
# timeout_seconds = 120

# Cap on generated tokens. Unset means no cap is sent; a per-call
# argument overrides this.
# max_tokens = 2048

# Filter tunables. Both tables are parsed leniently: an absent or
# unusable value silently keeps the default rather than erroring, unlike
# [llm] above.

[extract]
# Files at or under this many lines skip the local model and are
# returned whole, so extract works before any config exists.
# bypass_max_lines = 200
# chunk_bytes = 393216
# default_max_lines = 120
# max_file_bytes = 4194304

[grep]
# Hit lists at or under this size skip the local model, as above.
# bypass_max_hits = 8
# max_considered = 500
# batch_size = 250
# context_lines = 2
# context_max_bytes = 2000
# max_file_bytes = 1048576
# max_hits_scanned = 2000

# Terminal rendering for `scout grep`. Read only by the CLI — the MCP
# server never consults this table, so nothing here changes what Claude
# sees. Parsed leniently, like the two tables above.

[cli]
# auto | always | never. `auto` colors only when stdout is a terminal and
# NO_COLOR is unset. --color overrides.
# color = "auto"

# Default context lines around a match. Falls back to [grep]
# context_lines when unset. -C/--context overrides.
# context = 2

# Default result cap for terminal invocations — higher than the wire
# default of 10 because it is a ceiling, not a quota: the model returns
# only the hits it kept. -n/--max-hits overrides.
# max_hits = 20

# Per-line render cap, in bytes. A matched line over the cap is shown as a
# window around the match, ellipsised on the truncated side(s) and labelled
# with the line's real width; a context line is simply cut at the cap. 0
# disables the cap. -M/--max-columns overrides. Terminal rendering only:
# --format json and --format vimgrep are never capped.
# max_columns = 150

# `scout find` — intent-only search: you ask a question, the local model
# guesses the patterns, scout runs them and reranks the union. CLI-only
# (find is not an MCP tool), and parsed leniently like the tables above.

[find]
# Pattern-guess rounds before giving up. A round is retried only when
# *every* guessed pattern matched nothing — a thin result is still a
# result. 1 disables the retry. --attempts overrides.
# max_attempts = 2

# Candidate patterns requested from the model per round. Each one costs
# one search of the tree, so this is a latency knob as much as a
# recall knob.
# max_patterns = 8

# A guessed pattern matching more lines than this is a bad discriminator
# (`parse` in a parser), and *all* of its hits are dropped before the
# reranker sees them — a pattern that matches everything distinguishes
# nothing.
# degenerate_hit_cap = 300

# Byte cap on the paths-only file-tree sketch shown to the pattern
# guesser. Paths only — never symbols or file contents.
# tree_max_bytes = 8192

# Extra deny patterns for the shell-safety hook. These extend the
# baked-in deny floor and can never shrink it. Read by
# hooks/shell-safety.sh, not by the binary.
# [shell_safety]
# deny = ["rm -rf /", "dd if=.* of=/dev/"]
